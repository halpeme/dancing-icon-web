<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .nav-links {
            margin-top: 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            padding: 8px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            transition: background 0.3s;
            display: inline-block;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.3);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .gallery-item {
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s, border 0.3s;
            border: 3px solid #d0d0d0;
            position: relative;
        }

        .gallery-item.active {
            border-color: #22c55e;
        }

        .gallery-item.inactive {
            border-color: #d0d0d0;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.2);
        }

        .image-wrapper {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
                linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
                linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border-radius: 8px;
            overflow: hidden;
        }

        .gallery-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .toggle-btn {
            margin-top: 8px;
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 0.9rem;
        }

        .toggle-btn.activate {
            background-color: #22c55e;
            color: white;
        }

        .toggle-btn.activate:hover {
            background-color: #16a34a;
        }

        .toggle-btn.deactivate {
            background-color: #ef4444;
            color: white;
        }

        .toggle-btn.deactivate:hover {
            background-color: #dc2626;
        }

        .toggle-btn:disabled {
            background-color: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.active {
            background-color: #22c55e;
            color: white;
        }

        .status-badge.inactive {
            background-color: #d0d0d0;
            color: #6b7280;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .empty-state h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .empty-state p {
            font-size: 1.1rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }

            .image-wrapper {
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sticker Gallery</h1>
            <p class="subtitle">All submitted stickers</p>
            <div class="nav-links">
                <a href="/">Back to Stage</a>
                <a href="/camera">Take Photo</a>
            </div>
        </header>

        {% if images %}
            <div class="gallery">
                {% for image in images %}
                <div class="gallery-item inactive" data-filename="{{ image }}">
                    <span class="status-badge inactive">Saved</span>
                    <div class="image-wrapper">
                        <img src="/uploads/{{ image }}" alt="Sticker">
                    </div>
                    <button class="toggle-btn activate" onclick="toggleSticker('{{ image }}', 'activate')">
                        Activate
                    </button>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty-state">
                <h2>No stickers yet</h2>
                <p>Submit your first sticker from the camera page!</p>
            </div>
        {% endif %}
    </div>

    <script>
        // Track active stickers
        let activeStickers = new Set();
        let eventSource = null;

        // Fetch initial active stickers
        async function loadActiveStickers() {
            try {
                const response = await fetch('/api/active_stickers');
                const data = await response.json();
                activeStickers = new Set(data.active);
                updateGalleryUI();
            } catch (error) {
                console.error('Failed to load active stickers:', error);
            }
        }

        // Update gallery UI based on active state
        function updateGalleryUI() {
            document.querySelectorAll('.gallery-item').forEach(item => {
                const filename = item.dataset.filename;
                const isActive = activeStickers.has(filename);
                const badge = item.querySelector('.status-badge');
                const button = item.querySelector('.toggle-btn');

                if (isActive) {
                    item.classList.remove('inactive');
                    item.classList.add('active');
                    badge.classList.remove('inactive');
                    badge.classList.add('active');
                    badge.textContent = 'Live';
                    button.classList.remove('activate');
                    button.classList.add('deactivate');
                    button.textContent = 'Deactivate';
                    button.onclick = () => toggleSticker(filename, 'deactivate');
                } else {
                    item.classList.remove('active');
                    item.classList.add('inactive');
                    badge.classList.remove('active');
                    badge.classList.add('inactive');
                    badge.textContent = 'Saved';
                    button.classList.remove('deactivate');
                    button.classList.add('activate');
                    button.textContent = 'Activate';
                    button.onclick = () => toggleSticker(filename, 'activate');
                }
            });
        }

        // Toggle sticker activation
        async function toggleSticker(filename, action) {
            const button = document.querySelector(`[data-filename="${filename}"] .toggle-btn`);
            button.disabled = true;

            try {
                const response = await fetch('/api/toggle_sticker', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, action })
                });

                const data = await response.json();

                if (response.ok) {
                    // Update will come through SSE, but update immediately for responsiveness
                    if (action === 'activate') {
                        activeStickers.add(filename);
                    } else {
                        activeStickers.delete(filename);
                    }
                    updateGalleryUI();
                } else {
                    alert(data.error || 'Failed to toggle sticker');
                }
            } catch (error) {
                console.error('Toggle error:', error);
                alert('Failed to toggle sticker');
            } finally {
                button.disabled = false;
            }
        }

        // Connect to SSE for real-time updates
        function connectSSE() {
            eventSource = new EventSource('/stream');

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'init') {
                    // Initialize active stickers from SSE
                    activeStickers.clear();
                    data.stickers.forEach(sticker => {
                        const filename = sticker.image.split('/').pop();
                        activeStickers.add(filename);
                    });
                    updateGalleryUI();
                } else if (data.type === 'add') {
                    // Sticker activated
                    const filename = data.sticker.image.split('/').pop();
                    activeStickers.add(filename);
                    updateGalleryUI();
                } else if (data.type === 'remove') {
                    // Find and remove by sticker ID (need to match against current active list)
                    // Since we don't have ID->filename mapping, reload active list
                    loadActiveStickers();
                }
            };

            eventSource.onerror = () => {
                console.error('SSE connection error');
                eventSource.close();
                // Reconnect after 3 seconds
                setTimeout(connectSSE, 3000);
            };
        }

        // Initialize on page load
        loadActiveStickers();
        connectSSE();
    </script>
</body>
</html>
