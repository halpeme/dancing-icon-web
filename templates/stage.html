<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dancing Sticker Stage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      {% if overlay_mode %}
      background: transparent;
      {% else %}
      background: #080808;
      {% endif %}
    }

    /* QR Code Overlay */
    #qr-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    #qr-overlay.hidden {
      display: none;
    }

    #qr-overlay img {
      width: 250px;
      height: 250px;
    }

    #qr-overlay p {
      margin-top: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      color: #333;
    }

    #qr-overlay .url {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
      font-family: monospace;
    }

    /* Stage Container */
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    /* Sticker */
    .sticker {
      position: absolute;
      width: 350px;
      height: 350px;
      pointer-events: none;
      user-select: none;
      /* Position set via JS */
    }

    .sticker img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* will-change removed - added dynamically only during entrance */
      transform: translateZ(0);
      backface-visibility: visible;
    }

    .sticker img.dancing {
      transition: transform 0.2s ease-out;
    }

    .sticker img.spinning {
      transition: transform 0.4s ease-in-out;
    }

    /* Toggle QR button */
    #toggle-qr {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      padding: 12px 20px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #toggle-qr:hover {
      background: white;
    }

    /* Status indicator */
    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border-radius: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
    }

    #status.connected {
      background: rgba(39, 174, 96, 0.9);
    }

    #status.disconnected {
      background: rgba(231, 76, 60, 0.9);
    }

    /* Showstopper Effect Styles */

    /* Flash overlay */
    #flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: white;
      opacity: 0;
      z-index: 9999;
    }

    #flash-overlay.active {
      animation: flash 600ms ease-out;
    }

    @keyframes flash {
      0% { opacity: 0; }
      10% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* Spotlight overlay */
    #spotlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: radial-gradient(
        circle 400px at 50% 50%,
        transparent 0%,
        rgba(0, 0, 0, 0.85) 100%
      );
      opacity: 0;
      transition: opacity 300ms, background 100ms;
      z-index: 500;
    }

    #spotlight.active {
      opacity: 1;
    }

    /* Ripple canvas */
    #ripple-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 600;
    }

    /* Screen shake effect */
    #stage.shaking {
      animation: shake 400ms cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-4px, 0, 0); }
      20%, 80% { transform: translate3d(8px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    /* Background pulse effect */
    body.pulse-bg {
      animation: backgroundPulse 800ms ease-out;
    }

    @keyframes backgroundPulse {
      0% { background: #080808; }
      20% { background: #1a0a2e; }
      100% { background: #080808; }
    }

    /* Dimmed stickers effect */
    .sticker.dimmed img {
      transition: filter 300ms, opacity 300ms;
      filter: grayscale(0.7) blur(2px);
      opacity: 0.3;
    }

    .sticker.dimmed.undim img {
      filter: grayscale(0) blur(0);
      opacity: 1;
    }

    /* ===== RACE FEATURE ===== */
    #controls-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 998;
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.6);
      padding: 12px 16px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    #start-race-btn {
      padding: 10px 18px;
      font-size: 14px;
      background: linear-gradient(135deg, #FF6B6B, #FF8C42);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(255,107,107,0.4);
    }
    #start-race-btn:hover:not(:disabled) { transform: scale(1.05); }
    #start-race-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #race-countdown {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 120px;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 30px rgba(255,107,107,0.8), 0 0 60px rgba(255,200,0,0.6);
      z-index: 9998;
      pointer-events: none;
      user-select: none;
      font-family: Arial, sans-serif;
      display: none;
    }
    #race-countdown.active { display: block; }
    #finish-line {
      position: fixed;
      top: 0; right: 80px;
      width: 4px; height: 100vh;
      background: repeating-linear-gradient(45deg,#FFD700,#FFD700 10px,#fff 10px,#fff 20px);
      z-index: 500;
      pointer-events: none;
      display: none;
    }
    body.race-active #finish-line { display: block; }
    #race-track {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 60px);
      z-index: 1;
      pointer-events: none;
      display: none;
    }
    body.race-active #race-track { display: block; }
    .sticker.winner img {
      animation: winnerCelebration 600ms ease-in-out 4;
      filter: drop-shadow(0 0 20px gold) drop-shadow(0 0 40px #FFD700) !important;
    }
    @keyframes winnerCelebration {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.4); }
    }
    .sticker.loser img {
      transition: filter 300ms, opacity 300ms;
      filter: grayscale(1) opacity(0.4) blur(1px) !important;
    }
    #winner-announcement {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: 900;
      color: gold;
      text-shadow: 0 0 30px rgba(255,215,0,0.8);
      z-index: 9997;
      pointer-events: none;
      user-select: none;
      animation: announceWinner 2500ms ease-out forwards;
    }
    @keyframes announceWinner {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
      20%  { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      70%  { opacity: 1; transform: translate(-50%,-50%) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(0.9); }
    }

    #nav-links {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 999;
      display: flex;
      gap: 10px;
    }
    #nav-links a {
      display: inline-block;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.85);
      color: #080808;
      text-decoration: none;
      border-radius: 20px;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    #nav-links a:hover {
      background: rgba(255, 255, 255, 0.95);
    }
  </style>
</head>
<body>
  <!-- QR Code Overlay -->
  <div id="qr-overlay">
    <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code">
    <p>Scan to add stickers</p>
    <p class="url">{{ camera_url }}</p>
  </div>

  <!-- Stage for dancing stickers -->
  <div id="stage"></div>

  <!-- Toggle QR button -->
  <button id="toggle-qr">Show QR Code</button>

  <!-- Connection status -->
  <div id="status" class="disconnected">Connecting...</div>

  <!-- Showstopper Effect Overlays -->
  <div id="flash-overlay"></div>
  <div id="spotlight"></div>
  <canvas id="ripple-canvas"></canvas>

  <!-- Race Feature UI -->
  <div id="controls-panel">
    <button id="start-race-btn">🏁 Start Race</button>
  </div>
  <div id="race-countdown"></div>
  <div id="race-track"></div>
  <div id="finish-line"></div>

  <script>
    // VERSION 11 - ALL OPTIMIZATIONS COMPLETE
    // Phase 1 (Quick Wins):
    // - Persistent stickerArray (no Array.from() per frame)
    // - Removed debug console.logs
    // - EXIF optimization (ImageOps.exif_transpose)
    // - Lazy-load rembg models + GPU ready
    // Phase 2 (Medium Effort):
    // - Spatial hash grid collision detection (4-16x speedup)
    // - Particle pooling (35 particles vs 60, pre-allocated)
    // - WebP compression on backend (50-70% smaller files)
    // - CSS will-change only during entrance (GPU memory optimization)

    // Mode detection from URL or template variable
    const OVERLAY_MODE = new URLSearchParams(window.location.search).get('mode') === 'overlay';

    if (OVERLAY_MODE) {
      // Hide ALL UI elements - only show stickers
      document.getElementById('qr-overlay')?.classList.add('hidden');
      const toggleQrBtn = document.getElementById('toggle-qr');
      if (toggleQrBtn) toggleQrBtn.style.setProperty('display', 'none');
      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.style.setProperty('display', 'none');
      const flashOverlay = document.getElementById('flash-overlay');
      if (flashOverlay) flashOverlay.style.setProperty('display', 'none');
      const spotlight = document.getElementById('spotlight');
      if (spotlight) spotlight.style.setProperty('display', 'none');
      const rippleCanvas = document.getElementById('ripple-canvas');
      if (rippleCanvas) rippleCanvas.style.setProperty('display', 'none');
      const controlsPanel = document.getElementById('controls-panel');
      if (controlsPanel) controlsPanel.style.setProperty('display', 'none');

      // CSS already handles this via template, but set as backup
      document.body.style.background = 'transparent';
      document.documentElement.style.background = 'transparent';
    }

    // SHOWSTOPPER CONFIGURATION
    const CONFIG = {
      // Sticker entrance style
      entranceStyle: 'superhero',  // 'pop' (original) or 'superhero' (new)
      entranceDuration: 2000,      // milliseconds

      // Audio system
      enableAudio: !OVERLAY_MODE,
      audioVolume: 0.6,
      maxConcurrentSounds: 3,

      // Stage-wide effects
      enableFlash: !OVERLAY_MODE,
      flashColor: 'white',         // or any CSS color

      enableShake: !OVERLAY_MODE,
      shakeIntensity: 1.0,

      enableRipple: !OVERLAY_MODE,

      enableDimOthers: false,      // Performance: off by default
      dimDuration: 1800,           // milliseconds

      enableSpotlight: false,      // Performance: off by default
      spotlightDuration: 2000,     // milliseconds

      enableBackgroundPulse: false,  // Off by default

      enableParticles: false,      // Performance: off by default (not yet implemented)
    };

    // Race state — shared across all animation phases
    const raceState = {
      active: false,
      phase: null,               // 'lining-up' | 'countdown' | 'racing' | 'celebration' | 'returning'
      winnerId: null,
      startTime: 0,
      celebrationStart: 0,
      celebrationDuration: 3000,
      raceDuration: 8000,
      returnDuration: 2000,
      returnStartTime: 0,
      lineupStartTime: 0,
      lineupDuration: 1200,
      lineupFromPositions: new Map(),
      savedPhysics: new Map(),
      laneAssignments: new Map(),
      returnFromPositions: new Map()
    };

    // Sparkle colors for the shower effect
    const sparkleColors = [
      '#FFD700', // Gold
      '#FFFFFF', // White
      '#00FFFF', // Cyan
      '#FF1493', // Deep pink
      '#FF69B4', // Hot pink
      '#87CEEB'  // Sky blue
    ];

    // DOM elements
    const stage = document.getElementById('stage');
    const qrOverlay = document.getElementById('qr-overlay');
    const toggleBtn = document.getElementById('toggle-qr');
    const statusEl = document.getElementById('status');

    // Sticker state: Map of id -> { div, img, physics }
    const stickers = new Map();
    const stickerArray = []; // Persistent array for collision detection (avoids Array.from() per frame)
    const STICKER_SIZE = 350; // pixels (matches CSS)

    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Smooth entrance effect with nice overshoot
    // Ease-out-back curve: overshoots smoothly then settles
    function easeOutBack(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;

      const c1 = 2.5;  // Back constant (controls overshoot amount) - increased for more dramatic effect
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    // Physics state per sticker
    function createPhysicsState(x, y) {
      return {
        // Position (pixels from top-left)
        x: x,
        y: y,
        // Velocity (pixels per second)
        vx: randomRange(-100, 100),
        vy: randomRange(-100, 100),
        // Dance animation state (like old system)
        currentYRotation: 0,
        lastMoveTime: performance.now(),
        nextMoveDelay: randomRange(80, 250),
        isSpinning: false,
        spinStartTime: 0,
        spinDuration: 400,
        // Current dance transform values
        danceRotation: 0,
        danceTranslateX: 0,
        danceTranslateY: 0,
        danceScale: 1,
        danceSkewX: 0,
        // Entrance animation state
        isEntering: true,
        entranceStartTime: null,  // Set on first frame
        entranceDuration: CONFIG.entranceDuration,
        entranceProgress: 0,  // 0 to 1
        // Superhero entrance properties
        entranceStyle: CONFIG.entranceStyle,
        entranceStartY: -500,  // Start above screen for superhero
        impactScale: 1.5       // Scale spike on landing
      };
    }

    // ========== AUDIO SYSTEM ==========
    const audioSystem = {
      pools: {},
      maxConcurrent: CONFIG.maxConcurrentSounds,
      activeCount: 0,

      init() {
        const soundFiles = [
          'entrance-1.mp3',
          'entrance-2.mp3',
          'entrance-3.mp3',
          'entrance-4.mp3',
          'entrance-5.mp3'
        ];

        soundFiles.forEach(file => {
          this.pools[file] = [];
          // Create pool of 3 Audio objects per sound
          for (let i = 0; i < 3; i++) {
            const audio = new Audio(`/static/sounds/${file}`);
            audio.volume = CONFIG.audioVolume;
            audio.addEventListener('ended', () => {
              this.activeCount--;
            });
            this.pools[file].push(audio);
          }
        });
      },

      play(soundName = null) {
        if (!CONFIG.enableAudio) return;

        // Throttle if too many sounds playing
        if (this.activeCount >= this.maxConcurrent) return;

        // Random sound if not specified
        if (!soundName) {
          const soundFiles = Object.keys(this.pools);
          soundName = soundFiles[Math.floor(Math.random() * soundFiles.length)];
        }

        const pool = this.pools[soundName];
        if (!pool) {
          console.warn(`Sound ${soundName} not found in pools`);
          return;
        }

        // Find available audio element
        const audio = pool.find(a => a.paused || a.ended);
        if (audio) {
          audio.currentTime = 0;
          audio.play().catch(() => {}); // Silently ignore autoplay errors
          this.activeCount++;
        }
      },

      setVolume(volume) {
        Object.values(this.pools).forEach(pool => {
          pool.forEach(audio => audio.volume = volume);
        });
      }
    };

    // ========== RIPPLE SYSTEM (OPTIMIZED) ==========
    const rippleCanvas = document.getElementById('ripple-canvas');
    const rippleCtx = rippleCanvas.getContext('2d');
    let ripples = [];

    // Pre-allocated particle pool (reduced from 60 to 35 for less GC)
    const PARTICLE_POOL_SIZE = 500; // Pool for multiple ripples
    const particlePool = [];

    // Initialize particle pool
    for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
      particlePool.push({
        x: 0, y: 0,
        vx: 0, vy: 0,
        size: 0,
        rotation: 0,
        rotationSpeed: 0,
        color: '#FFFFFF',
        alpha: 0,
        twinklePhase: 0,
        twinkleSpeed: 0,
        startTime: 0,
        duration: 0,
        gravity: 0,
        points: 4,
        active: false,
        currentSize: 0
      });
    }

    // Resize canvas once on init and on window resize (not every frame)
    function resizeRippleCanvas() {
      rippleCanvas.width = window.innerWidth;
      rippleCanvas.height = window.innerHeight;
    }
    resizeRippleCanvas();
    window.addEventListener('resize', resizeRippleCanvas);

    function createRipple(x, y) {
      if (!CONFIG.enableRipple) return;

      const numSparkles = 35; // Reduced from 60 (still looks great, less GC)
      let poolIndex = 0;

      for (let i = 0; i < numSparkles; i++) {
        // Find available particle from pool
        while (poolIndex < PARTICLE_POOL_SIZE && particlePool[poolIndex].active) {
          poolIndex++;
        }
        if (poolIndex >= PARTICLE_POOL_SIZE) break; // Pool exhausted

        const particle = particlePool[poolIndex];

        // Fountain pattern: upward arc (-144° to -36°)
        const angle = randomRange(-Math.PI * 0.8, -Math.PI * 0.2);
        const speed = randomRange(150, 350);

        // Reuse particle object instead of creating new one
        particle.x = x;
        particle.y = y;
        particle.vx = Math.cos(angle) * speed;
        particle.vy = Math.sin(angle) * speed;
        particle.size = randomRange(4, 12);
        particle.rotation = randomRange(0, 360);
        particle.rotationSpeed = randomRange(180, 540);
        particle.color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
        particle.alpha = 1;
        particle.twinklePhase = randomRange(0, Math.PI * 2);
        particle.twinkleSpeed = randomRange(4, 6);
        particle.startTime = performance.now();
        particle.duration = 1400;
        particle.gravity = 100;
        particle.points = Math.random() > 0.5 ? 4 : 6;
        particle.active = true;
        particle.currentSize = particle.size;

        ripples.push(particle);
      }
    }

    function updateRipples(deltaTime) {
      if (!CONFIG.enableRipple || ripples.length === 0) return;

      const dt = deltaTime / 1000;
      const now = performance.now();

      // Update particles and mark completed ones as inactive
      for (let i = ripples.length - 1; i >= 0; i--) {
        const sparkle = ripples[i];
        const elapsed = now - sparkle.startTime;
        const progress = Math.min(elapsed / sparkle.duration, 1);

        if (progress >= 1) {
          // Mark as inactive (return to pool) and remove from active list
          sparkle.active = false;
          ripples.splice(i, 1);
          continue;
        }

        // Physics: velocity and gravity
        sparkle.x += sparkle.vx * dt;
        sparkle.y += sparkle.vy * dt;
        sparkle.vy += sparkle.gravity * dt;
        sparkle.rotation += sparkle.rotationSpeed * dt;

        // Twinkle effect (brightness oscillation)
        sparkle.twinklePhase += sparkle.twinkleSpeed * dt * Math.PI * 2;
        const twinkleFactor = (Math.sin(sparkle.twinklePhase) + 1) / 2;

        // Fade with twinkle
        const baseFade = Math.pow(1 - progress, 1.8);
        sparkle.alpha = baseFade * (0.4 + twinkleFactor * 0.6);

        // Shrink over time
        sparkle.currentSize = sparkle.size * (1 - progress * 0.5);
      }
    }

    function renderRipples() {
      if (!CONFIG.enableRipple || ripples.length === 0) return;

      // Clear canvas (don't resize - that's handled by resize handler)
      rippleCtx.clearRect(0, 0, rippleCanvas.width, rippleCanvas.height);

      ripples.forEach(sparkle => {
        rippleCtx.save();
        rippleCtx.translate(sparkle.x, sparkle.y);
        rippleCtx.rotate(sparkle.rotation * Math.PI / 180);
        rippleCtx.globalAlpha = sparkle.alpha;
        rippleCtx.fillStyle = sparkle.color;

        // Draw star shape (4-point or 6-point)
        const numPoints = sparkle.points;
        const outerRadius = sparkle.currentSize;
        const innerRadius = outerRadius * 0.4;

        rippleCtx.beginPath();
        for (let i = 0; i < numPoints * 2; i++) {
          const angle = (Math.PI * i) / numPoints - Math.PI / 2;
          const radius = i % 2 === 0 ? outerRadius : innerRadius;
          const px = Math.cos(angle) * radius;
          const py = Math.sin(angle) * radius;
          if (i === 0) rippleCtx.moveTo(px, py);
          else rippleCtx.lineTo(px, py);
        }
        rippleCtx.closePath();
        rippleCtx.fill();

        rippleCtx.restore();
      });
    }

    // ========== STAGE EFFECT FUNCTIONS ==========

    function triggerFlash(color = 'white') {
      if (!CONFIG.enableFlash) return;

      const flash = document.getElementById('flash-overlay');
      flash.style.background = color;
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 600);
    }

    function triggerShake(intensity = 1.0) {
      if (!CONFIG.enableShake) return;

      stage.classList.add('shaking');
      setTimeout(() => stage.classList.remove('shaking'), 400);
    }

    function triggerSpotlight(x, y, duration = 2000) {
      if (!CONFIG.enableSpotlight) return;

      const spotlight = document.getElementById('spotlight');
      const xPercent = (x / window.innerWidth) * 100;
      const yPercent = (y / window.innerHeight) * 100;

      spotlight.style.background = `radial-gradient(
        circle 500px at ${xPercent}% ${yPercent}%,
        transparent 0%,
        rgba(0, 0, 0, 0.85) 100%
      )`;
      spotlight.classList.add('active');

      setTimeout(() => spotlight.classList.remove('active'), duration);
    }

    function dimExistingStickers(duration = 1800) {
      if (!CONFIG.enableDimOthers) return;

      stickers.forEach((sticker, id) => {
        if (!sticker.physics.isEntering) {
          sticker.div.classList.add('dimmed');
        }
      });

      setTimeout(() => {
        stickers.forEach(sticker => {
          sticker.div.classList.add('undim');
          setTimeout(() => {
            sticker.div.classList.remove('dimmed', 'undim');
          }, 300);
        });
      }, duration);
    }

    function triggerBackgroundPulse() {
      if (!CONFIG.enableBackgroundPulse) return;

      document.body.classList.add('pulse-bg');
      setTimeout(() => document.body.classList.remove('pulse-bg'), 800);
    }

    // ========== SUPERHERO ENTRANCE EASING ==========

    // Ease function for superhero landing (drop, impact, bounce)
    function easeInOutBounce(t) {
      if (t < 0.6) {
        // Accelerate down (0-60%)
        const dropProgress = t / 0.6;
        return dropProgress * dropProgress * dropProgress;
      } else {
        // Bounce settle with decreasing bounces (60-100%)
        const bounceProgress = (t - 0.6) / 0.4;
        return 1 - Math.abs(Math.sin(bounceProgress * Math.PI * 3)) * Math.pow(1 - bounceProgress, 2);
      }
    }

    // Check collision between two circles
    const COLLISION_RADIUS_FACTOR = 0.5; // How close stickers get before bouncing (0.5 = very close, 0.8 = far apart)
    function checkCollision(s1, s2) {
      const dx = s2.x - s1.x;
      const dy = s2.y - s1.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const minDist = STICKER_SIZE * COLLISION_RADIUS_FACTOR;
      return distance < minDist ? { dx, dy, distance } : null;
    }

    // Resolve collision between two stickers
    function resolveCollision(state1, state2, collision) {
      const { dx, dy, distance } = collision;

      // Normalize collision vector
      const nx = dx / distance;
      const ny = dy / distance;

      // Separate stickers
      const overlap = (STICKER_SIZE * COLLISION_RADIUS_FACTOR - distance) / 2;
      state1.x -= nx * overlap;
      state1.y -= ny * overlap;
      state2.x += nx * overlap;
      state2.y += ny * overlap;

      // Calculate relative velocity
      const dvx = state2.vx - state1.vx;
      const dvy = state2.vy - state1.vy;
      const dotProduct = dvx * nx + dvy * ny;

      // Don't resolve if velocities are separating
      if (dotProduct > 0) return;

      // Apply collision impulse (elastic collision)
      const impulse = dotProduct;
      state1.vx += nx * impulse;
      state1.vy += ny * impulse;
      state2.vx -= nx * impulse;
      state2.vy -= ny * impulse;
    }

    // Apply dance move to a sticker (like old system)
    function applyDanceMove(physics) {
      physics.danceRotation = randomRange(-30, 30);
      physics.danceTranslateX = randomRange(-20, 20);
      physics.danceTranslateY = randomRange(-15, 15);
      physics.danceScale = randomRange(0.85, 1.15);
      physics.danceSkewX = randomRange(-8, 8);
    }

    // Start spin animation
    function startSpin(physics) {
      physics.currentYRotation += 180;
      physics.isSpinning = true;
      physics.spinStartTime = performance.now();
      physics.spinDuration = 400;
    }

    // ========== SPATIAL HASH GRID FOR COLLISION OPTIMIZATION ==========
    // Grid configuration
    const GRID_CELL_SIZE = STICKER_SIZE * 1.5; // Cell size slightly larger than sticker
    let spatialGrid = new Map(); // Maps "x,y" key to array of stickers

    function getGridKey(x, y) {
      const gridX = Math.floor(x / GRID_CELL_SIZE);
      const gridY = Math.floor(y / GRID_CELL_SIZE);
      return `${gridX},${gridY}`;
    }

    function getGridCells(physics) {
      // Get all grid cells this sticker overlaps (usually 1-4 cells)
      const radius = STICKER_SIZE / 2;
      const minX = Math.floor((physics.x - radius) / GRID_CELL_SIZE);
      const maxX = Math.floor((physics.x + radius) / GRID_CELL_SIZE);
      const minY = Math.floor((physics.y - radius) / GRID_CELL_SIZE);
      const maxY = Math.floor((physics.y + radius) / GRID_CELL_SIZE);

      const cells = [];
      for (let gx = minX; gx <= maxX; gx++) {
        for (let gy = minY; gy <= maxY; gy++) {
          cells.push(`${gx},${gy}`);
        }
      }
      return cells;
    }

    function buildSpatialGrid() {
      // Rebuild grid from scratch each frame (simple and effective)
      spatialGrid.clear();

      for (const sticker of stickerArray) {
        const cells = getGridCells(sticker.physics);
        for (const cell of cells) {
          if (!spatialGrid.has(cell)) {
            spatialGrid.set(cell, []);
          }
          spatialGrid.get(cell).push(sticker);
        }
      }
    }

    // Update physics for all stickers
    function updatePhysics(deltaTime, timestamp) {
      if (raceState.active) {
        updateRacePhysics(deltaTime, timestamp);
        return;
      }
      const stageWidth = window.innerWidth;
      const stageHeight = window.innerHeight;
      const dt = deltaTime / 1000; // Convert to seconds

      // Update positions and dance animations
      for (const [id, sticker] of stickers) {
        const physics = sticker.physics;

        // Update entrance animation
        if (physics.isEntering) {
          if (physics.entranceStartTime === null) {
            physics.entranceStartTime = timestamp;
          }

          const elapsed = timestamp - physics.entranceStartTime;
          physics.entranceProgress = Math.min(elapsed / physics.entranceDuration, 1);

          if (physics.entranceProgress >= 1) {
            physics.isEntering = false;
          }
        }

        // Apply velocity (position movement)
        physics.x += physics.vx * dt;
        physics.y += physics.vy * dt;

        // Screen edge collision
        const radius = STICKER_SIZE / 2;
        if (physics.x - radius < 0) {
          physics.x = radius;
          physics.vx = Math.abs(physics.vx);
        } else if (physics.x + radius > stageWidth) {
          physics.x = stageWidth - radius;
          physics.vx = -Math.abs(physics.vx);
        }

        if (physics.y - radius < 0) {
          physics.y = radius;
          physics.vy = Math.abs(physics.vy);
        } else if (physics.y + radius > stageHeight) {
          physics.y = stageHeight - radius;
          physics.vy = -Math.abs(physics.vy);
        }

        // Dance animation (like old system)
        if (physics.isSpinning) {
          if (timestamp - physics.spinStartTime >= physics.spinDuration) {
            physics.isSpinning = false;
            physics.lastMoveTime = timestamp;
            physics.nextMoveDelay = randomRange(80, 250);
          }
        } else {
          if (timestamp - physics.lastMoveTime >= physics.nextMoveDelay) {
            if (Math.random() < 0.08) {
              startSpin(physics);
            } else {
              applyDanceMove(physics);
              physics.lastMoveTime = timestamp;
              physics.nextMoveDelay = randomRange(80, 250);
            }
          }
        }
      }

      // Sticker-to-sticker collision detection (SPATIAL HASH OPTIMIZED)
      // Build spatial grid for this frame
      buildSpatialGrid();

      // Track checked pairs to avoid duplicate checks
      const checkedPairs = new Set();

      // Check collisions only within same/adjacent grid cells
      for (const sticker of stickerArray) {
        const cells = getGridCells(sticker.physics);

        for (const cell of cells) {
          const cellStickers = spatialGrid.get(cell);
          if (!cellStickers) continue;

          for (const other of cellStickers) {
            if (sticker === other) continue;

            // Create unique pair key (smaller ID first to avoid duplicates)
            const id1 = sticker.div.dataset.id;
            const id2 = other.div.dataset.id;
            const pairKey = id1 < id2 ? `${id1}-${id2}` : `${id2}-${id1}`;

            if (checkedPairs.has(pairKey)) continue;
            checkedPairs.add(pairKey);

            // Check and resolve collision
            const collision = checkCollision(sticker.physics, other.physics);
            if (collision) {
              resolveCollision(sticker.physics, other.physics, collision);
            }
          }
        }
      }
    }

    // Render stickers
    function render() {
      for (const [id, sticker] of stickers) {
        const { div, img, physics } = sticker;

        // Update position (centered on physics.x, physics.y)
        div.style.left = (physics.x - STICKER_SIZE / 2) + 'px';
        div.style.top = (physics.y - STICKER_SIZE / 2) + 'px';

        // Update image transform
        if (physics.isEntering) {
          // During entrance: apply entrance animation based on style
          img.classList.remove('spinning', 'dancing');

          // OPTIMIZATION: Remove will-change when entrance completes
          if (physics.entranceProgress >= 1) {
            img.style.willChange = 'auto';
          }

          if (physics.entranceStyle === 'superhero') {
            // Superhero landing: drop from top with rotation and impact
            const progress = physics.entranceProgress;
            let entranceScale = easeInOutBounce(progress);

            // Add impact scale spike at 60-70% progress
            if (progress >= 0.6 && progress <= 0.7) {
              const impactProgress = (progress - 0.6) / 0.1;
              const impactSpike = Math.sin(impactProgress * Math.PI) * (physics.impactScale - 1);
              entranceScale *= (1 + impactSpike);
            }

            // Apply Y offset for drop effect (starts above screen)
            const dropOffset = (1 - progress) * physics.entranceStartY;

            // Rotation during drop
            const rotationDegrees = progress * 360;

            img.style.transform = `
              translateY(${dropOffset}px)
              scale(${entranceScale})
              rotate(${rotationDegrees}deg)
            `;
          } else {
            // Original 'pop' entrance: smooth scale with overshoot
            const entranceScale = easeOutBack(physics.entranceProgress);
            img.style.transform = `scale(${entranceScale})`;
          }
        } else if (physics.isSpinning) {
          // After entrance: apply spin animation
          img.classList.add('spinning');
          img.classList.remove('dancing');
          img.style.transform = `
            rotateY(${physics.currentYRotation}deg)
          `;
        } else {
          // After entrance: apply full dance animation
          img.classList.remove('spinning');
          img.classList.add('dancing');
          img.style.transform = `
            rotateY(${physics.currentYRotation}deg)
            rotate(${physics.danceRotation}deg)
            translate(${physics.danceTranslateX}px, ${physics.danceTranslateY}px)
            scale(${physics.danceScale})
            skewX(${physics.danceSkewX}deg)
          `;
        }
      }
    }

    // Main animation loop
    let lastTimestamp = 0;
    function animationLoop(timestamp) {
      const deltaTime = timestamp - lastTimestamp || 16;
      lastTimestamp = timestamp;

      updatePhysics(deltaTime, timestamp);
      updateRipples(deltaTime);
      render();
      renderRipples();

      requestAnimationFrame(animationLoop);
    }

    // Add sticker to stage
    function addSticker(stickerData) {
      const div = document.createElement('div');
      div.className = 'sticker';
      div.dataset.id = stickerData.id;

      const img = document.createElement('img');
      img.src = stickerData.image;
      img.alt = 'Sticker';

      // OPTIMIZATION: Only enable will-change during entrance animation
      img.style.willChange = 'transform';

      div.appendChild(img);

      stage.appendChild(div);

      // Convert percentage to pixels
      const x = (stickerData.x / 100) * window.innerWidth;
      const y = (stickerData.y / 100) * window.innerHeight;

      const physics = createPhysicsState(x, y);
      const stickerObj = { div, img, physics };
      stickers.set(stickerData.id, stickerObj);
      stickerArray.push(stickerObj); // Update persistent array

      // ========== TRIGGER ALL SHOWSTOPPER EFFECTS ==========
      audioSystem.play();  // Play random entrance sound
      triggerFlash(CONFIG.flashColor);
      triggerShake(CONFIG.shakeIntensity);
      createRipple(x, y);
      triggerSpotlight(x, y, CONFIG.spotlightDuration);
      dimExistingStickers(CONFIG.dimDuration);
      triggerBackgroundPulse();

      // Hide QR when first sticker arrives
      if (stickers.size === 1) {
        qrOverlay.classList.add('hidden');
        toggleBtn.textContent = 'Show QR Code';
      }
    }

    // Remove sticker from stage
    function removeSticker(id) {
      if (raceState.active && id === raceState.winnerId) endRace();
      const sticker = stickers.get(id);
      if (sticker) {
        sticker.div.remove();
        stickers.delete(id);

        // Update persistent array
        const index = stickerArray.indexOf(sticker);
        if (index > -1) {
          stickerArray.splice(index, 1);
        }
      }

      // Show QR if no stickers left
      if (stickers.size === 0) {
        qrOverlay.classList.remove('hidden');
        toggleBtn.textContent = 'Hide QR Code';
      }
    }

    // SSE Connection
    let eventSource = null;
    let reconnectTimeout = null;

    function connect() {
      eventSource = new EventSource('/stream');

      eventSource.onopen = () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'connected';
      };

      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);

        switch (data.type) {
          case 'init':
            if (raceState.active) endRace();
            // Clear existing and load initial stickers
            stickers.forEach((_, id) => removeSticker(id));
            data.stickers.forEach(s => addSticker(s));
            break;

          case 'add':
            addSticker(data.sticker);
            break;

          case 'remove':
            removeSticker(data.id);
            break;

          case 'race_start':
            beginRaceWithWinner(data.winnerId);
            break;
        }
      };

      eventSource.onerror = () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'disconnected';
        eventSource.close();

        // Reconnect after 3 seconds
        clearTimeout(reconnectTimeout);
        reconnectTimeout = setTimeout(connect, 3000);
      };
    }

    // Toggle QR overlay
    toggleBtn.addEventListener('click', () => {
      qrOverlay.classList.toggle('hidden');
      toggleBtn.textContent = qrOverlay.classList.contains('hidden')
        ? 'Show QR Code'
        : 'Hide QR Code';
    });

    // ===== RACE FEATURE =====

    function startRace() {
      if (stickers.size < 2) {
        const msg = document.createElement('div');
        msg.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:20px 32px;border-radius:16px;font-size:22px;z-index:9999;pointer-events:none';
        msg.textContent = 'Need at least 2 stickers!';
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
        return;
      }
      if (raceState.active) return;
      document.getElementById('start-race-btn').disabled = true;
      fetch('/race/start', { method: 'POST' })
        .catch(() => { document.getElementById('start-race-btn').disabled = false; });
    }

    function beginRaceWithWinner(winnerId) {
      if (raceState.active) return;
      raceState.active = true;
      raceState.phase = 'lining-up';
      raceState.winnerId = winnerId;
      raceState.laneAssignments.clear();
      raceState.savedPhysics.clear();

      const laneHeight = window.innerHeight / stickers.size;
      let laneIndex = 0;
      for (const [id, sticker] of stickers) {
        const p = sticker.physics;
        raceState.savedPhysics.set(id, {
          x: p.x, y: p.y, vx: p.vx, vy: p.vy,
          danceRotation: p.danceRotation,
          danceTranslateX: p.danceTranslateX,
          danceTranslateY: p.danceTranslateY,
          danceScale: p.danceScale,
          danceSkewX: p.danceSkewX,
          isSpinning: p.isSpinning,
          currentYRotation: p.currentYRotation
        });
        const isWinner = id === winnerId;
        raceState.laneAssignments.set(id, {
          laneIndex,
          laneY: (laneIndex + 0.5) * laneHeight,
          baseSpeed: isWinner ? randomRange(560, 620) : randomRange(480, 580),
          speedFreq: randomRange(0.0008, 0.0025),   // oscillation frequency
          speedPhase: Math.random() * Math.PI * 2,  // random phase offset
          speedAmp: randomRange(80, 180)             // speed variance amplitude
        });
        laneIndex++;
      }

      document.body.classList.add('race-active');

      // Record current positions for lineup animation
      raceState.lineupFromPositions.clear();
      for (const [id, sticker] of stickers) {
        raceState.lineupFromPositions.set(id, { x: sticker.physics.x, y: sticker.physics.y });
      }
      raceState.phase = 'lining-up';
      raceState.lineupStartTime = null;   // set on first frame via timestamp
    }

    function showCountdown() {
      const el = document.getElementById('race-countdown');
      el.classList.add('active');
      const steps = ['3', '2', '1', 'GO!'];
      let i = 0;
      const tick = () => {
        el.textContent = steps[i++];
        if (i < steps.length) setTimeout(tick, 800);
        else setTimeout(() => { el.classList.remove('active'); el.textContent = ''; beginRacingPhase(); }, 800);
      };
      tick();
    }

    function beginRacingPhase() {
      raceState.phase = 'racing';
      raceState.startTime = performance.now();
      for (const [id] of stickers) {
        const el = document.getElementById('sticker-' + id);
        if (el) el.classList.add('racing');
      }
    }

    function updateRacePhysics(deltaTime, timestamp) {
      const dt = deltaTime / 1000;
      if (raceState.phase === 'lining-up') {
        if (raceState.lineupStartTime === null) raceState.lineupStartTime = timestamp;
        const t = Math.min((timestamp - raceState.lineupStartTime) / raceState.lineupDuration, 1);
        const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; // easeInOutCubic
        const startX = 20; // left edge start position
        for (const [id, sticker] of stickers) {
          const lane = raceState.laneAssignments.get(id);
          const from = raceState.lineupFromPositions.get(id);
          if (!lane || !from) continue;
          sticker.physics.x = from.x + (startX - from.x) * ease;
          sticker.physics.y = from.y + (lane.laneY - 80 - from.y) * ease;
        }
        if (t >= 1) {
          // Snap to start positions and begin countdown
          for (const [id, sticker] of stickers) {
            const lane = raceState.laneAssignments.get(id);
            if (!lane) continue;
            sticker.physics.x = 20;
            sticker.physics.y = lane.laneY - 80;
          }
          raceState.phase = 'countdown';
          showCountdown();
        }
      } else if (raceState.phase === 'racing') {
        const finishX = window.innerWidth - 80;
        let finished = false;
        for (const [id, sticker] of stickers) {
          const lane = raceState.laneAssignments.get(id);
          if (!lane) continue;
          const p = sticker.physics;
          // Variable speed: base + sinusoidal fluctuation
          const currentSpeed = lane.baseSpeed + Math.sin(timestamp * lane.speedFreq + lane.speedPhase) * lane.speedAmp;
          p.x += Math.max(currentSpeed, 80) * dt;
          p.y = lane.laneY - 80 + Math.sin(timestamp * 0.003 + lane.laneIndex) * 10;
          p.danceRotation = Math.sin(timestamp * 0.004 + lane.laneIndex) * 15;
          if (!finished && id === raceState.winnerId && p.x + 80 >= finishX) {
            finished = true;
            triggerRaceFinish(timestamp);
          }
        }
        if (!finished && performance.now() - raceState.startTime > raceState.raceDuration) {
          triggerRaceFinish(timestamp);
        }
      } else if (raceState.phase === 'celebration') {
        if (performance.now() - raceState.celebrationStart > raceState.celebrationDuration) {
          raceState.phase = 'returning';
          raceState.returnStartTime = performance.now();
          raceState.returnFromPositions.clear();
          for (const [id, sticker] of stickers) {
            raceState.returnFromPositions.set(id, { x: sticker.physics.x, y: sticker.physics.y });
          }
        }
      } else if (raceState.phase === 'returning') {
        const t = Math.min((performance.now() - raceState.returnStartTime) / raceState.returnDuration, 1);
        const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
        for (const [id, sticker] of stickers) {
          const saved = raceState.savedPhysics.get(id);
          const from = raceState.returnFromPositions.get(id);
          if (!saved || !from) continue;
          sticker.physics.x = from.x + (saved.x - from.x) * ease;
          sticker.physics.y = from.y + (saved.y - from.y) * ease;
        }
        if (t >= 1) endRace();
      }
    }

    function triggerRaceFinish(timestamp) {
      raceState.phase = 'celebration';
      raceState.celebrationStart = performance.now();
      for (const [id, sticker] of stickers) {
        if (id === raceState.winnerId) sticker.div.classList.add('winner');
        else sticker.div.classList.add('loser');
      }
      triggerFlash();
      triggerShake(1.5);
      createRipple(window.innerWidth - 80, window.innerHeight / 2);
      const ann = document.createElement('div');
      ann.id = 'winner-announcement';
      ann.textContent = '🏆 WINNER!';
      document.body.appendChild(ann);
      setTimeout(() => ann.remove(), 2500);
    }

    function endRace() {
      raceState.active = false;
      raceState.phase = null;
      raceState.winnerId = null;
      for (const [id, sticker] of stickers) {
        sticker.div.classList.remove('racing', 'winner', 'loser');
        const saved = raceState.savedPhysics.get(id);
        if (saved) {
          Object.assign(sticker.physics, saved);
        }
      }
      document.body.classList.remove('race-active');
      raceState.savedPhysics.clear();
      raceState.laneAssignments.clear();
      raceState.returnFromPositions.clear();
      raceState.lineupFromPositions.clear();
      const btn = document.getElementById('start-race-btn');
      if (btn) btn.disabled = false;
    }

    document.getElementById('start-race-btn').addEventListener('click', startRace);

    // Start
    audioSystem.init();
    connect();
    requestAnimationFrame(animationLoop);
  </script>

  {% if not overlay_mode %}
  <nav id="nav-links">
    <a href="/camera">Camera</a>
    <a href="/gallery">Gallery</a>
  </nav>
  {% endif %}
</body>
</html>
