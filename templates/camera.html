<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Add Sticker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Camera/File input area */
    #capture-area {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: #2d2d44;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 3px dashed #4a4a6a;
      transition: border-color 0.2s;
    }

    #capture-area:hover {
      border-color: #6c63ff;
    }

    #capture-area svg {
      width: 80px;
      height: 80px;
      fill: #6c63ff;
      margin-bottom: 16px;
    }

    #capture-area p {
      font-size: 16px;
      color: #888;
    }

    /* Hidden file inputs */
    #camera-input,
    #file-upload {
      display: none;
    }

    /* Separator */
    .separator {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin: 20px 0;
      color: #666;
      font-size: 14px;
    }

    .separator::before,
    .separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #4a4a6a;
    }

    .separator span {
      padding: 0 16px;
    }

    /* Secondary button (upload) */
    .secondary-btn {
      width: 100%;
      max-width: 400px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 500;
      background: transparent;
      color: #888;
      border: 2px solid #4a4a6a;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .secondary-btn:hover {
      border-color: #6c63ff;
      color: #6c63ff;
      background: rgba(108, 99, 255, 0.05);
    }

    .secondary-btn svg {
      width: 24px;
      height: 24px;
    }

    /* Drag-over state */
    #capture-area.drag-over {
      border-color: #6c63ff;
      background: rgba(108, 99, 255, 0.1);
    }

    /* Quality toggle */
    #quality-toggle {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #quality-toggle.visible {
      display: flex;
    }

    #quality-toggle label {
      font-size: 14px;
      color: #aaa;
      text-align: center;
    }

    .toggle-options {
      display: flex;
      background: #2d2d44;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .toggle-option {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      background: transparent;
      color: #888;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .toggle-option.active {
      background: #6c63ff;
      color: white;
    }

    .toggle-option span {
      font-size: 11px;
      opacity: 0.7;
    }

    /* Process button */
    #process-btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      font-weight: 600;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: none;
    }

    #process-btn:hover {
      background: #5a52d5;
    }

    #process-btn:disabled {
      background: #4a4a6a;
      cursor: not-allowed;
    }

    #process-btn.visible {
      display: block;
    }

    /* Preview area (after processing) */
    #preview-area {
      display: none;
      width: 100%;
      max-width: 400px;
      flex-direction: column;
      align-items: center;
    }

    #preview-area.visible {
      display: flex;
    }

    /* Checkered background for transparency */
    #sticker-preview {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      background-image:
        linear-gradient(45deg, #ccc 25%, transparent 25%),
        linear-gradient(-45deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #sticker-preview img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    /* Rotation controls */
    #rotation-controls {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }

    .rotate-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #2d2d44;
      border: 2px solid #6c63ff;
      color: #6c63ff;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .rotate-btn:hover {
      background: #3d3d54;
    }

    .rotate-btn:active {
      background: #6c63ff;
      color: white;
    }

    /* Submit button */
    #submit-btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: 600;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #submit-btn:hover {
      background: #219a52;
    }

    /* Retake button */
    #retake-btn {
      margin-top: 12px;
      padding: 12px 24px;
      font-size: 14px;
      background: transparent;
      color: #888;
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      cursor: pointer;
    }

    #retake-btn:hover {
      border-color: #6c63ff;
      color: #6c63ff;
    }

    /* Status messages */
    #status {
      margin-top: 20px;
      padding: 16px 24px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      display: none;
      width: 100%;
      max-width: 400px;
    }

    #status.visible {
      display: block;
    }

    #status.processing {
      background: #2d2d44;
      color: #ffd93d;
    }

    #status.success {
      background: #1e5631;
      color: #4ade80;
    }

    #status.error {
      background: #5c1e1e;
      color: #f87171;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 217, 61, 0.3);
      border-top-color: #ffd93d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Original preview (before processing) */
    #original-preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      display: none;
    }

    #original-preview.visible {
      display: block;
    }

    #capture-area.has-image {
      border-style: solid;
      border-color: #6c63ff;
      padding: 10px;
    }

    #capture-area.has-image svg,
    #capture-area.has-image p {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Add a Dancing Sticker</h1>

  <!-- Step 1: Capture -->
  <div id="capture-area">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
      <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
    </svg>
    <p>Take a Photo</p>
    <img id="original-preview" alt="Preview">
  </div>

  <div class="separator">
    <span>OR</span>
  </div>

  <button id="upload-btn" class="secondary-btn">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
      <path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
    </svg>
    Upload from Files
  </button>

  <input type="file" id="camera-input" accept="image/*" capture="environment">
  <input type="file" id="file-upload" accept="image/*">

  <!-- Quality toggle -->
  <div id="quality-toggle">
    <label>Background Removal Quality</label>
    <div class="toggle-options">
      <button class="toggle-option active" data-model="fast">
        <div>⚡ Fast</div>
        <span>&lt;1s</span>
      </button>
      <button class="toggle-option" data-model="quality">
        <div>✨ Quality</div>
        <span>~10s</span>
      </button>
    </div>
  </div>

  <button id="process-btn">Remove Background</button>

  <div id="status"></div>

  <!-- Step 2: Preview & Rotate -->
  <div id="preview-area">
    <div id="sticker-preview">
      <img id="sticker-img" alt="Sticker">
    </div>

    <div id="rotation-controls">
      <button class="rotate-btn" id="rotate-left">↺</button>
      <button class="rotate-btn" id="rotate-right">↻</button>
    </div>

    <button id="submit-btn">Add to Stage</button>
    <button id="retake-btn">Take Another Photo</button>
  </div>

  <script>
    // Elements
    const captureArea = document.getElementById('capture-area');
    const cameraInput = document.getElementById('camera-input');
    const fileUpload = document.getElementById('file-upload');
    const uploadBtn = document.getElementById('upload-btn');
    const originalPreview = document.getElementById('original-preview');
    const qualityToggle = document.getElementById('quality-toggle');
    const toggleOptions = document.querySelectorAll('.toggle-option');
    const processBtn = document.getElementById('process-btn');
    const status = document.getElementById('status');
    const previewArea = document.getElementById('preview-area');
    const stickerImg = document.getElementById('sticker-img');
    const rotateLeftBtn = document.getElementById('rotate-left');
    const rotateRightBtn = document.getElementById('rotate-right');
    const submitBtn = document.getElementById('submit-btn');
    const retakeBtn = document.getElementById('retake-btn');

    // State
    let selectedFile = null;
    let processedImage = null;
    let rotation = 0;
    let selectedModel = 'fast'; // default to fast model

    // Tap capture area to open camera
    captureArea.addEventListener('click', () => {
      if (!captureArea.classList.contains('has-image')) {
        cameraInput.click();
      }
    });

    // Tap upload button to open file picker
    uploadBtn.addEventListener('click', () => {
      fileUpload.click();
    });

    // Quality toggle handlers
    toggleOptions.forEach(option => {
      option.addEventListener('click', () => {
        toggleOptions.forEach(opt => opt.classList.remove('active'));
        option.classList.add('active');
        selectedModel = option.dataset.model;
      });
    });

    // Handle file selection (from camera or file upload)
    function handleFileSelection(e) {
      const file = e.target.files[0];
      if (!file) return;

      // File size validation (max 10MB)
      const maxSize = 10 * 1024 * 1024; // 10MB in bytes
      if (file.size > maxSize) {
        status.className = 'error visible';
        status.textContent = 'File too large. Maximum size: 10MB';
        cameraInput.value = '';
        fileUpload.value = '';
        return;
      }

      // MIME type validation
      const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/gif'];
      if (!validTypes.includes(file.type.toLowerCase())) {
        status.className = 'error visible';
        status.textContent = 'Invalid file type. Please select an image (JPEG, PNG, WebP, or GIF).';
        cameraInput.value = '';
        fileUpload.value = '';
        return;
      }

      selectedFile = file;
      processedImage = null;
      rotation = 0;

      // Show original preview
      const reader = new FileReader();
      reader.onload = (e) => {
        originalPreview.src = e.target.result;
        originalPreview.classList.add('visible');
        captureArea.classList.add('has-image');
      };
      reader.readAsDataURL(file);

      qualityToggle.classList.add('visible');
      processBtn.classList.add('visible');
      previewArea.classList.remove('visible');
      status.classList.remove('visible');
    }

    // Attach handler to both inputs
    cameraInput.addEventListener('change', handleFileSelection);
    fileUpload.addEventListener('change', handleFileSelection);

    // Drag-and-drop support for desktop
    captureArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!captureArea.classList.contains('has-image')) {
        captureArea.classList.add('drag-over');
      }
    });

    captureArea.addEventListener('dragleave', (e) => {
      e.preventDefault();
      captureArea.classList.remove('drag-over');
    });

    captureArea.addEventListener('drop', (e) => {
      e.preventDefault();
      captureArea.classList.remove('drag-over');

      if (captureArea.classList.contains('has-image')) return;

      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        // Trigger the same validation and preview logic
        const fakeEvent = { target: { files: [file] } };
        handleFileSelection(fakeEvent);
      } else if (file) {
        status.className = 'error visible';
        status.textContent = 'Invalid file type. Please drop an image file.';
      }
    });

    // Process (remove background)
    processBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      processBtn.disabled = true;
      status.className = 'processing visible';
      status.innerHTML = '<span class="spinner"></span>Removing background...';

      const formData = new FormData();
      formData.append('photo', selectedFile);
      formData.append('model', selectedModel); // Pass selected model

      try {
        const response = await fetch('/process', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (response.ok && result.success) {
          processedImage = result.image;
          rotation = 0;

          // Show sticker preview
          stickerImg.src = processedImage;
          stickerImg.style.transform = 'rotate(0deg)';

          // Hide capture, show preview
          captureArea.style.display = 'none';
          qualityToggle.classList.remove('visible');
          processBtn.classList.remove('visible');
          status.classList.remove('visible');
          previewArea.classList.add('visible');
        } else {
          throw new Error(result.error || 'Processing failed');
        }
      } catch (error) {
        status.className = 'error visible';
        status.textContent = 'Error: ' + error.message;
        processBtn.disabled = false;
      }
    });

    // Rotate left
    rotateLeftBtn.addEventListener('click', () => {
      rotation = (rotation - 90) % 360;
      stickerImg.style.transform = `rotate(${rotation}deg)`;
    });

    // Rotate right
    rotateRightBtn.addEventListener('click', () => {
      rotation = (rotation + 90) % 360;
      stickerImg.style.transform = `rotate(${rotation}deg)`;
    });

    // Submit to stage
    submitBtn.addEventListener('click', async () => {
      if (!processedImage) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Adding...';

      try {
        const response = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: processedImage,
            rotation: rotation
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          status.className = 'success visible';
          status.textContent = 'Sticker added to stage!';
          previewArea.classList.remove('visible');

          // Auto reset after 2 seconds
          setTimeout(resetForm, 2000);
        } else {
          throw new Error(result.error || 'Submit failed');
        }
      } catch (error) {
        status.className = 'error visible';
        status.textContent = 'Error: ' + error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add to Stage';
      }
    });

    // Retake photo
    retakeBtn.addEventListener('click', resetForm);

    function resetForm() {
      selectedFile = null;
      processedImage = null;
      rotation = 0;
      cameraInput.value = '';
      fileUpload.value = '';
      originalPreview.src = '';
      originalPreview.classList.remove('visible');
      captureArea.classList.remove('has-image');
      captureArea.style.display = 'flex';
      qualityToggle.classList.remove('visible');
      processBtn.classList.remove('visible');
      processBtn.disabled = false;
      previewArea.classList.remove('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Add to Stage';
      status.classList.remove('visible');
    }
  </script>
</body>
</html>
