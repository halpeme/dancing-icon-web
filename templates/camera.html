<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Add Sticker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Camera/File input area */
    #capture-area {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: #2d2d44;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 3px dashed #4a4a6a;
      transition: border-color 0.2s;
    }

    #capture-area:hover {
      border-color: #6c63ff;
    }

    #capture-area svg {
      width: 80px;
      height: 80px;
      fill: #6c63ff;
      margin-bottom: 16px;
    }

    #capture-area p {
      font-size: 16px;
      color: #888;
    }

    /* Hidden file inputs */
    #camera-input,
    #file-upload {
      display: none;
    }

    /* Separator */
    .separator {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin: 20px 0;
      color: #666;
      font-size: 14px;
    }

    .separator::before,
    .separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #4a4a6a;
    }

    .separator span {
      padding: 0 16px;
    }

    /* Secondary button (upload) */
    .secondary-btn {
      width: 100%;
      max-width: 400px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 500;
      background: transparent;
      color: #888;
      border: 2px solid #4a4a6a;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .secondary-btn:hover {
      border-color: #6c63ff;
      color: #6c63ff;
      background: rgba(108, 99, 255, 0.05);
    }

    .secondary-btn svg {
      width: 24px;
      height: 24px;
    }

    /* Drag-over state */
    #capture-area.drag-over {
      border-color: #6c63ff;
      background: rgba(108, 99, 255, 0.1);
    }

    /* Mode toggle */
    #mode-toggle {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #mode-toggle.visible {
      display: flex;
    }

    #mode-toggle label {
      font-size: 14px;
      color: #aaa;
      text-align: center;
    }

    /* Quality toggle */
    #quality-toggle {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #quality-toggle.visible {
      display: flex;
    }

    #quality-toggle label {
      font-size: 14px;
      color: #aaa;
      text-align: center;
    }

    /* Selection toggle (for manual mode) */
    #selection-toggle {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #selection-toggle.visible {
      display: flex;
    }

    #selection-toggle label {
      font-size: 14px;
      color: #aaa;
      text-align: center;
    }

    /* Clear points button */
    #clear-points-btn {
      display: none;
    }

    #clear-points-btn.visible {
      display: flex;
    }

    .toggle-options {
      display: flex;
      background: #2d2d44;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .toggle-option {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      background: transparent;
      color: #888;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .toggle-option.active {
      background: #6c63ff;
      color: white;
    }

    .toggle-option span {
      font-size: 11px;
      opacity: 0.7;
    }

    /* Process button */
    #process-btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      font-weight: 600;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: none;
    }

    #process-btn:hover {
      background: #5a52d5;
    }

    #process-btn:disabled {
      background: #4a4a6a;
      cursor: not-allowed;
    }

    #process-btn.visible {
      display: block;
    }

    /* Preview area (after processing) */
    #preview-area {
      display: none;
      width: 100%;
      max-width: 400px;
      flex-direction: column;
      align-items: center;
    }

    #preview-area.visible {
      display: flex;
    }

    /* Checkered background for transparency */
    #sticker-preview {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      background-image:
        linear-gradient(45deg, #ccc 25%, transparent 25%),
        linear-gradient(-45deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #sticker-preview img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    /* Rotation controls */
    #rotation-controls {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }

    .rotate-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #2d2d44;
      border: 2px solid #6c63ff;
      color: #6c63ff;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .rotate-btn:hover {
      background: #3d3d54;
    }

    .rotate-btn:active {
      background: #6c63ff;
      color: white;
    }

    /* Submit button */
    #submit-btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: 600;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #submit-btn:hover {
      background: #219a52;
    }

    /* Retake button */
    #retake-btn {
      margin-top: 12px;
      padding: 12px 24px;
      font-size: 14px;
      background: transparent;
      color: #888;
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      cursor: pointer;
    }

    #retake-btn:hover {
      border-color: #6c63ff;
      color: #6c63ff;
    }

    /* Status messages */
    #status {
      margin-top: 20px;
      padding: 16px 24px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      display: none;
      width: 100%;
      max-width: 400px;
    }

    #status.visible {
      display: block;
    }

    #status.processing {
      background: #2d2d44;
      color: #ffd93d;
    }

    #status.success {
      background: #1e5631;
      color: #4ade80;
    }

    #status.error {
      background: #5c1e1e;
      color: #f87171;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 217, 61, 0.3);
      border-top-color: #ffd93d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Original preview (before processing) */
    #original-preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      display: none;
    }

    #original-preview.visible {
      display: block;
    }

    #capture-area.has-image {
      border-style: solid;
      border-color: #6c63ff;
      padding: 10px;
    }

    #capture-area.has-image svg,
    #capture-area.has-image p {
      display: none;
    }

    /* Canvas overlay for manual selection */
    #selection-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      display: none;
    }

    #selection-canvas.visible {
      display: block;
    }

    #capture-area {
      position: relative;
    }

    /* Manual mode instructions */
    .manual-instructions {
      width: 100%;
      max-width: 400px;
      margin-top: 12px;
      padding: 12px;
      background: #2d2d44;
      border-radius: 8px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      display: none;
    }

    .manual-instructions.visible {
      display: block;
    }

    .manual-instructions strong {
      color: #6c63ff;
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>Add a Dancing Sticker</h1>

  <!-- Step 1: Capture -->
  <div id="capture-area">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
      <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
    </svg>
    <p>Take a Photo</p>
    <img id="original-preview" alt="Preview">
    <canvas id="selection-canvas"></canvas>
  </div>

  <div class="separator">
    <span>OR</span>
  </div>

  <button id="upload-btn" class="secondary-btn">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
      <path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
    </svg>
    Upload from Files
  </button>

  <input type="file" id="camera-input" accept="image/*" capture="environment">
  <input type="file" id="file-upload" accept="image/*">

  <!-- Mode toggle -->
  <div id="mode-toggle">
    <label>Removal Mode</label>
    <div class="toggle-options">
      <button class="toggle-option active" data-mode="auto">
        <div>🤖 Auto Remove</div>
        <span>AI detects</span>
      </button>
      <button class="toggle-option" data-mode="manual">
        <div>✋ Manual Select</div>
        <span>Click areas</span>
      </button>
    </div>
  </div>

  <!-- Quality toggle (only for auto mode) -->
  <div id="quality-toggle">
    <label>Background Removal Quality</label>
    <div class="toggle-options">
      <button class="toggle-option active" data-model="fast">
        <div>⚡ Fast</div>
        <span>&lt;1s</span>
      </button>
      <button class="toggle-option" data-model="quality">
        <div>✨ Quality</div>
        <span>~10s</span>
      </button>
    </div>
  </div>

  <!-- Selection toggle (only for manual mode) -->
  <div id="selection-toggle">
    <label>Click on image to mark areas</label>
    <div class="toggle-options">
      <button class="toggle-option active" data-selection="keep">
        <div>✅ Keep Area</div>
        <span>Foreground</span>
      </button>
      <button class="toggle-option" data-selection="remove">
        <div>❌ Remove Area</div>
        <span>Background</span>
      </button>
    </div>
  </div>

  <!-- Clear points button -->
  <button id="clear-points-btn" class="secondary-btn" style="margin-top: 12px;">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
      <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </svg>
    Clear All Points
  </button>

  <!-- Manual mode instructions -->
  <div class="manual-instructions">
    <strong>How to use Manual Mode:</strong>
    Select Keep or Remove, then click areas on the image.<br>
    Green = Keep • Red = Remove
  </div>

  <button id="process-btn">Remove Background</button>

  <div id="status"></div>

  <!-- Step 2: Preview & Rotate -->
  <div id="preview-area">
    <div id="sticker-preview">
      <img id="sticker-img" alt="Sticker">
    </div>

    <div id="rotation-controls">
      <button class="rotate-btn" id="rotate-left">↺</button>
      <button class="rotate-btn" id="rotate-right">↻</button>
    </div>

    <button id="submit-btn">Add to Stage</button>
    <button id="retake-btn">Take Another Photo</button>
  </div>

  <script>
    // Elements
    const captureArea = document.getElementById('capture-area');
    const cameraInput = document.getElementById('camera-input');
    const fileUpload = document.getElementById('file-upload');
    const uploadBtn = document.getElementById('upload-btn');
    const originalPreview = document.getElementById('original-preview');
    const modeToggle = document.getElementById('mode-toggle');
    const modeOptions = document.querySelectorAll('#mode-toggle .toggle-option');
    const qualityToggle = document.getElementById('quality-toggle');
    const qualityOptions = document.querySelectorAll('#quality-toggle .toggle-option');
    const selectionToggle = document.getElementById('selection-toggle');
    const selectionOptions = document.querySelectorAll('#selection-toggle .toggle-option');
    const clearPointsBtn = document.getElementById('clear-points-btn');
    const manualInstructions = document.querySelector('.manual-instructions');
    const selectionCanvas = document.getElementById('selection-canvas');
    const processBtn = document.getElementById('process-btn');
    const status = document.getElementById('status');
    const previewArea = document.getElementById('preview-area');
    const stickerImg = document.getElementById('sticker-img');
    const rotateLeftBtn = document.getElementById('rotate-left');
    const rotateRightBtn = document.getElementById('rotate-right');
    const submitBtn = document.getElementById('submit-btn');
    const retakeBtn = document.getElementById('retake-btn');

    // State
    let selectedFile = null;
    let processedImage = null;
    let rotation = 0;
    let selectedMode = 'auto'; // auto or manual
    let selectedModel = 'fast'; // fast or quality (for auto mode)
    let currentSelection = 'keep'; // keep or remove (for manual mode)
    let manualPoints = []; // [[y, x], ...]
    let manualLabels = []; // [1, 2, ...] where 1=foreground, 2=background
    let canvasContext = null;

    // Tap capture area to open camera
    captureArea.addEventListener('click', () => {
      if (!captureArea.classList.contains('has-image')) {
        cameraInput.click();
      }
    });

    // Tap upload button to open file picker
    uploadBtn.addEventListener('click', () => {
      fileUpload.click();
    });

    // Mode toggle handlers
    modeOptions.forEach(option => {
      option.addEventListener('click', () => {
        modeOptions.forEach(opt => opt.classList.remove('active'));
        option.classList.add('active');
        selectedMode = option.dataset.mode;

        // Show/hide toggles based on mode
        if (selectedMode === 'auto') {
          qualityToggle.classList.add('visible');
          selectionToggle.classList.remove('visible');
          clearPointsBtn.classList.remove('visible');
          manualInstructions.classList.remove('visible');
          selectionCanvas.classList.remove('visible');
          // Clear manual selections
          manualPoints = [];
          manualLabels = [];
          if (canvasContext) {
            canvasContext.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
          }
        } else {
          qualityToggle.classList.remove('visible');
          selectionToggle.classList.add('visible');
          clearPointsBtn.classList.add('visible');
          manualInstructions.classList.add('visible');
          selectionCanvas.classList.add('visible');
        }
      });
    });

    // Quality toggle handlers (for auto mode)
    qualityOptions.forEach(option => {
      option.addEventListener('click', () => {
        qualityOptions.forEach(opt => opt.classList.remove('active'));
        option.classList.add('active');
        selectedModel = option.dataset.model;
      });
    });

    // Selection toggle handlers (for manual mode)
    selectionOptions.forEach(option => {
      option.addEventListener('click', () => {
        selectionOptions.forEach(opt => opt.classList.remove('active'));
        option.classList.add('active');
        currentSelection = option.dataset.selection;
      });
    });

    // Handle file selection (from camera or file upload)
    function handleFileSelection(e) {
      const file = e.target.files[0];
      if (!file) return;

      // File size validation (max 10MB)
      const maxSize = 10 * 1024 * 1024; // 10MB in bytes
      if (file.size > maxSize) {
        status.className = 'error visible';
        status.textContent = 'File too large. Maximum size: 10MB';
        cameraInput.value = '';
        fileUpload.value = '';
        return;
      }

      // MIME type validation
      const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/gif'];
      if (!validTypes.includes(file.type.toLowerCase())) {
        status.className = 'error visible';
        status.textContent = 'Invalid file type. Please select an image (JPEG, PNG, WebP, or GIF).';
        cameraInput.value = '';
        fileUpload.value = '';
        return;
      }

      selectedFile = file;
      processedImage = null;
      rotation = 0;
      manualPoints = [];
      manualLabels = [];

      // Show original preview
      const reader = new FileReader();
      reader.onload = (e) => {
        originalPreview.src = e.target.result;
        originalPreview.classList.add('visible');
        captureArea.classList.add('has-image');

        // Setup canvas for manual mode
        originalPreview.onload = () => {
          const rect = originalPreview.getBoundingClientRect();
          selectionCanvas.width = rect.width;
          selectionCanvas.height = rect.height;
          canvasContext = selectionCanvas.getContext('2d');
        };
      };
      reader.readAsDataURL(file);

      modeToggle.classList.add('visible');
      // Show appropriate toggles based on mode
      if (selectedMode === 'auto') {
        qualityToggle.classList.add('visible');
      } else {
        selectionToggle.classList.add('visible');
        clearPointsBtn.classList.add('visible');
        manualInstructions.classList.add('visible');
        selectionCanvas.classList.add('visible');
      }
      processBtn.classList.add('visible');
      previewArea.classList.remove('visible');
      status.classList.remove('visible');
    }

    // Attach handler to both inputs
    cameraInput.addEventListener('change', handleFileSelection);
    fileUpload.addEventListener('change', handleFileSelection);

    // Canvas click handler for manual point selection
    selectionCanvas.addEventListener('click', (e) => {
      if (selectedMode !== 'manual' || !canvasContext) return;

      const rect = selectionCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Calculate actual displayed image dimensions within the container
      // (accounting for object-fit: contain padding)
      const imgNaturalRatio = originalPreview.naturalWidth / originalPreview.naturalHeight;
      const containerRatio = rect.width / rect.height;

      let displayedWidth, displayedHeight, offsetX, offsetY;

      if (imgNaturalRatio > containerRatio) {
        // Image is wider - will have vertical padding (pillarboxed)
        displayedWidth = rect.width;
        displayedHeight = rect.width / imgNaturalRatio;
        offsetX = 0;
        offsetY = (rect.height - displayedHeight) / 2;
      } else {
        // Image is taller - will have horizontal padding (letterboxed)
        displayedWidth = rect.height * imgNaturalRatio;
        displayedHeight = rect.height;
        offsetX = (rect.width - displayedWidth) / 2;
        offsetY = 0;
      }

      // Adjust click coordinates to account for padding
      const adjustedX = clickX - offsetX;
      const adjustedY = clickY - offsetY;

      // Check if click is outside the actual image area (in padding)
      if (adjustedX < 0 || adjustedX > displayedWidth || adjustedY < 0 || adjustedY > displayedHeight) {
        return; // Ignore clicks in padding area
      }

      // Use current selection mode (keep or remove)
      const isKeep = currentSelection === 'keep';
      const label = isKeep ? 1 : 0;  // SAM expects: 1=foreground (keep), 0=background (remove)

      // Scale coordinates from displayed size to original image natural dimensions
      const scaleX = originalPreview.naturalWidth / displayedWidth;
      const scaleY = originalPreview.naturalHeight / displayedHeight;
      const imgX = adjustedX * scaleX;
      const imgY = adjustedY * scaleY;

      // Store point in [y, x] format as required by rembg/SAM
      manualPoints.push([imgY, imgX]);
      manualLabels.push(label);

      // Draw dot on canvas at click position (use original click coordinates for display)
      canvasContext.fillStyle = isKeep ? 'rgba(0, 255, 0, 0.8)' : 'rgba(255, 0, 0, 0.8)';
      canvasContext.beginPath();
      canvasContext.arc(clickX, clickY, 8, 0, 2 * Math.PI);
      canvasContext.fill();

      // Draw outline
      canvasContext.strokeStyle = 'white';
      canvasContext.lineWidth = 2;
      canvasContext.stroke();

      // Draw number label
      canvasContext.fillStyle = 'white';
      canvasContext.font = 'bold 12px sans-serif';
      canvasContext.textAlign = 'center';
      canvasContext.textBaseline = 'middle';
      canvasContext.fillText(manualPoints.length, clickX, clickY);
    });

    // Clear points button handler
    clearPointsBtn.addEventListener('click', () => {
      manualPoints = [];
      manualLabels = [];
      if (canvasContext) {
        canvasContext.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
      }
      status.classList.remove('visible');
    });

    // Drag-and-drop support for desktop
    captureArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!captureArea.classList.contains('has-image')) {
        captureArea.classList.add('drag-over');
      }
    });

    captureArea.addEventListener('dragleave', (e) => {
      e.preventDefault();
      captureArea.classList.remove('drag-over');
    });

    captureArea.addEventListener('drop', (e) => {
      e.preventDefault();
      captureArea.classList.remove('drag-over');

      if (captureArea.classList.contains('has-image')) return;

      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        // Trigger the same validation and preview logic
        const fakeEvent = { target: { files: [file] } };
        handleFileSelection(fakeEvent);
      } else if (file) {
        status.className = 'error visible';
        status.textContent = 'Invalid file type. Please drop an image file.';
      }
    });

    // Process (remove background)
    processBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      // Validate manual mode has points
      if (selectedMode === 'manual' && manualPoints.length === 0) {
        status.className = 'error visible';
        status.textContent = 'Please select at least one area by clicking on the image';
        return;
      }

      processBtn.disabled = true;
      status.className = 'processing visible';

      if (selectedMode === 'manual') {
        status.innerHTML = `<span class="spinner"></span>Processing ${manualPoints.length} selection(s)...`;
      } else {
        status.innerHTML = '<span class="spinner"></span>Removing background...';
      }

      const formData = new FormData();
      formData.append('photo', selectedFile);
      formData.append('mode', selectedMode); // Pass mode (auto or manual)

      if (selectedMode === 'auto') {
        formData.append('model', selectedModel); // Pass selected model for auto mode
      } else {
        // Pass points and labels for manual mode
        formData.append('points', JSON.stringify(manualPoints));
        formData.append('labels', JSON.stringify(manualLabels));
      }

      try {
        const response = await fetch('/process', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (response.ok && result.success) {
          processedImage = result.image;
          rotation = 0;

          // Show sticker preview
          stickerImg.src = processedImage;
          stickerImg.style.transform = 'rotate(0deg)';

          // Hide capture, show preview
          captureArea.style.display = 'none';
          modeToggle.classList.remove('visible');
          qualityToggle.classList.remove('visible');
          selectionToggle.classList.remove('visible');
          clearPointsBtn.classList.remove('visible');
          manualInstructions.classList.remove('visible');
          selectionCanvas.classList.remove('visible');
          processBtn.classList.remove('visible');
          status.classList.remove('visible');
          previewArea.classList.add('visible');
        } else {
          throw new Error(result.error || 'Processing failed');
        }
      } catch (error) {
        status.className = 'error visible';
        status.textContent = 'Error: ' + error.message;
        processBtn.disabled = false;
      }
    });

    // Rotate left
    rotateLeftBtn.addEventListener('click', () => {
      rotation = (rotation - 90) % 360;
      stickerImg.style.transform = `rotate(${rotation}deg)`;
    });

    // Rotate right
    rotateRightBtn.addEventListener('click', () => {
      rotation = (rotation + 90) % 360;
      stickerImg.style.transform = `rotate(${rotation}deg)`;
    });

    // Submit to stage
    submitBtn.addEventListener('click', async () => {
      if (!processedImage) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Adding...';

      try {
        const response = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: processedImage,
            rotation: rotation
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          status.className = 'success visible';
          status.textContent = 'Sticker added to stage!';
          previewArea.classList.remove('visible');

          // Auto reset after 2 seconds
          setTimeout(resetForm, 2000);
        } else {
          throw new Error(result.error || 'Submit failed');
        }
      } catch (error) {
        status.className = 'error visible';
        status.textContent = 'Error: ' + error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add to Stage';
      }
    });

    // Retake photo
    retakeBtn.addEventListener('click', resetForm);

    function resetForm() {
      selectedFile = null;
      processedImage = null;
      rotation = 0;
      manualPoints = [];
      manualLabels = [];
      cameraInput.value = '';
      fileUpload.value = '';
      originalPreview.src = '';
      originalPreview.classList.remove('visible');
      captureArea.classList.remove('has-image');
      captureArea.style.display = 'flex';
      modeToggle.classList.remove('visible');
      qualityToggle.classList.remove('visible');
      selectionToggle.classList.remove('visible');
      clearPointsBtn.classList.remove('visible');
      manualInstructions.classList.remove('visible');
      selectionCanvas.classList.remove('visible');
      if (canvasContext) {
        canvasContext.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
      }
      processBtn.classList.remove('visible');
      processBtn.disabled = false;
      previewArea.classList.remove('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Add to Stage';
      status.classList.remove('visible');
    }
  </script>
</body>
</html>
