<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Add Sticker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Camera/File input area */
    #capture-area {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: #2d2d44;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 3px dashed #4a4a6a;
      transition: border-color 0.2s;
    }

    #capture-area:hover {
      border-color: #6c63ff;
    }

    #capture-area svg {
      width: 80px;
      height: 80px;
      fill: #6c63ff;
      margin-bottom: 16px;
    }

    #capture-area p {
      font-size: 16px;
      color: #888;
    }

    /* Hidden file inputs */
    #camera-input,
    #file-upload {
      display: none;
    }

    /* Separator */
    .separator {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin: 20px 0;
      color: #666;
      font-size: 14px;
    }

    .separator::before,
    .separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #4a4a6a;
    }

    .separator span {
      padding: 0 16px;
    }

    /* Secondary button (upload) */
    .secondary-btn {
      width: 100%;
      max-width: 400px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 500;
      background: transparent;
      color: #888;
      border: 2px solid #4a4a6a;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .secondary-btn:hover {
      border-color: #6c63ff;
      color: #6c63ff;
      background: rgba(108, 99, 255, 0.05);
    }

    .secondary-btn svg {
      width: 24px;
      height: 24px;
    }

    /* Drag-over state */
    #capture-area.drag-over {
      border-color: #6c63ff;
      background: rgba(108, 99, 255, 0.1);
    }

    /* Mode toggle */
    #mode-toggle {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #mode-toggle.visible {
      display: flex;
    }

    #mode-toggle label {
      font-size: 14px;
      color: #aaa;
      text-align: center;
    }

    /* Quality toggle */
    #quality-toggle {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #quality-toggle.visible {
      display: flex;
    }

    #quality-toggle label {
      font-size: 14px;
      color: #aaa;
      text-align: center;
    }

    /* Undo button (for manual mode) */
    #undo-btn {
      display: none;
    }

    #undo-btn.visible {
      display: flex;
    }

    .toggle-options {
      display: flex;
      background: #2d2d44;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .toggle-option {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      background: transparent;
      color: #888;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .toggle-option.active {
      background: #6c63ff;
      color: white;
    }

    .toggle-option span {
      font-size: 11px;
      opacity: 0.7;
    }

    /* Process button */
    #process-btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      font-weight: 600;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: none;
    }

    #process-btn:hover {
      background: #5a52d5;
    }

    #process-btn:disabled {
      background: #4a4a6a;
      cursor: not-allowed;
    }

    #process-btn.visible {
      display: block;
    }

    /* Preview area (after processing) */
    #preview-area {
      display: none;
      width: 100%;
      max-width: 400px;
      flex-direction: column;
      align-items: center;
    }

    #preview-area.visible {
      display: flex;
    }

    /* Checkered background for transparency */
    #sticker-preview {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      background-image:
        linear-gradient(45deg, #ccc 25%, transparent 25%),
        linear-gradient(-45deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #sticker-preview img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    /* Rotation controls */
    #rotation-controls {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }

    .rotate-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #2d2d44;
      border: 2px solid #6c63ff;
      color: #6c63ff;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .rotate-btn:hover {
      background: #3d3d54;
    }

    .rotate-btn:active {
      background: #6c63ff;
      color: white;
    }

    /* Submit button */
    #submit-btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: 600;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #submit-btn:hover {
      background: #219a52;
    }

    /* Retake button */
    #retake-btn {
      margin-top: 12px;
      padding: 12px 24px;
      font-size: 14px;
      background: transparent;
      color: #888;
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      cursor: pointer;
    }

    #retake-btn:hover {
      border-color: #6c63ff;
      color: #6c63ff;
    }

    /* Status messages */
    #status {
      margin-top: 20px;
      padding: 16px 24px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      display: none;
      width: 100%;
      max-width: 400px;
    }

    #status.visible {
      display: block;
    }

    #status.processing {
      background: #2d2d44;
      color: #ffd93d;
    }

    #status.success {
      background: #1e5631;
      color: #4ade80;
    }

    #status.error {
      background: #5c1e1e;
      color: #f87171;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 217, 61, 0.3);
      border-top-color: #ffd93d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Original preview (before processing) */
    #original-preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      display: none;
    }

    #original-preview.visible {
      display: block;
    }

    #capture-area.has-image {
      border-style: solid;
      border-color: #6c63ff;
      padding: 10px;
    }

    #capture-area.has-image svg,
    #capture-area.has-image p {
      display: none;
    }

    /* Canvas overlay for manual selection */
    #selection-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      display: none;
      touch-action: none; /* Prevent scrolling while painting */
    }

    #selection-canvas.visible {
      display: block;
    }

    #capture-area {
      position: relative;
    }

    /* Manual mode instructions */
    .manual-instructions {
      width: 100%;
      max-width: 400px;
      margin-top: 12px;
      padding: 12px;
      background: #2d2d44;
      border-radius: 8px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      display: none;
    }

    .manual-instructions.visible {
      display: block;
    }

    .manual-instructions strong {
      color: #6c63ff;
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>Add a Dancing Sticker</h1>

  <!-- Step 1: Capture -->
  <div id="capture-area">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
      <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
    </svg>
    <p>Take a Photo</p>
    <img id="original-preview" alt="Preview">
    <canvas id="selection-canvas"></canvas>
  </div>

  <div class="separator">
    <span>OR</span>
  </div>

  <button id="upload-btn" class="secondary-btn">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
      <path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
    </svg>
    Upload from Files
  </button>

  <input type="file" id="camera-input" accept="image/*" capture="environment">
  <input type="file" id="file-upload" accept="image/*">

  <!-- Mode toggle -->
  <div id="mode-toggle">
    <label>Removal Mode</label>
    <div class="toggle-options">
      <button class="toggle-option active" data-mode="auto">
        <div>🤖 Auto Remove</div>
        <span>AI detects</span>
      </button>
      <button class="toggle-option" data-mode="manual">
        <div>✋ Manual Select</div>
        <span>Click areas</span>
      </button>
    </div>
  </div>

  <!-- Quality toggle (only for auto mode) -->
  <div id="quality-toggle">
    <label>Background Removal Quality</label>
    <div class="toggle-options">
      <button class="toggle-option active" data-model="fast">
        <div>⚡ Fast</div>
        <span>&lt;1s</span>
      </button>
      <button class="toggle-option" data-model="quality">
        <div>✨ Quality</div>
        <span>~10s</span>
      </button>
    </div>
  </div>

  <!-- Undo button (for manual mode) -->
  <button id="undo-btn" class="secondary-btn" style="margin-top: 12px;">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
      <path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
    </svg>
    Undo
  </button>

  <!-- Manual mode instructions -->
  <div class="manual-instructions">
    <strong>How to use Manual Mode:</strong>
    Paint over areas you want to remove.<br>
    Swipe or drag to paint • Tap Undo to revert
  </div>

  <button id="process-btn">Remove Background</button>

  <div id="status"></div>

  <!-- Step 2: Preview & Rotate -->
  <div id="preview-area">
    <div id="sticker-preview">
      <img id="sticker-img" alt="Sticker">
    </div>

    <div id="rotation-controls">
      <button class="rotate-btn" id="rotate-left">↺</button>
      <button class="rotate-btn" id="rotate-right">↻</button>
    </div>

    <button id="submit-btn">Add to Stage</button>
    <button id="retake-btn">Take Another Photo</button>
  </div>

  <script>
    // Elements
    const captureArea = document.getElementById('capture-area');
    const cameraInput = document.getElementById('camera-input');
    const fileUpload = document.getElementById('file-upload');
    const uploadBtn = document.getElementById('upload-btn');
    const originalPreview = document.getElementById('original-preview');
    const modeToggle = document.getElementById('mode-toggle');
    const modeOptions = document.querySelectorAll('#mode-toggle .toggle-option');
    const qualityToggle = document.getElementById('quality-toggle');
    const qualityOptions = document.querySelectorAll('#quality-toggle .toggle-option');
    const undoBtn = document.getElementById('undo-btn');
    const manualInstructions = document.querySelector('.manual-instructions');
    const selectionCanvas = document.getElementById('selection-canvas');
    const processBtn = document.getElementById('process-btn');
    const status = document.getElementById('status');
    const previewArea = document.getElementById('preview-area');
    const stickerImg = document.getElementById('sticker-img');
    const rotateLeftBtn = document.getElementById('rotate-left');
    const rotateRightBtn = document.getElementById('rotate-right');
    const submitBtn = document.getElementById('submit-btn');
    const retakeBtn = document.getElementById('retake-btn');

    // State
    let selectedFile = null;
    let processedImage = null;
    let rotation = 0;
    let selectedMode = 'auto'; // auto or manual
    let selectedModel = 'fast'; // fast or quality (for auto mode)
    let strokes = []; // Array of strokes, each stroke = [{x, y}, ...]
    let isDrawing = false;
    let currentStroke = [];
    let canvasContext = null;
    const BRUSH_SIZE = 24;

    // Tap capture area to open camera
    captureArea.addEventListener('click', () => {
      if (!captureArea.classList.contains('has-image')) {
        cameraInput.click();
      }
    });

    // Tap upload button to open file picker
    uploadBtn.addEventListener('click', () => {
      fileUpload.click();
    });

    // Mode toggle handlers
    modeOptions.forEach(option => {
      option.addEventListener('click', () => {
        modeOptions.forEach(opt => opt.classList.remove('active'));
        option.classList.add('active');
        selectedMode = option.dataset.mode;

        // Show/hide toggles based on mode
        if (selectedMode === 'auto') {
          qualityToggle.classList.add('visible');
          undoBtn.classList.remove('visible');
          manualInstructions.classList.remove('visible');
          selectionCanvas.classList.remove('visible');
          // Clear brush strokes
          strokes = [];
          currentStroke = [];
          isDrawing = false;
          if (canvasContext) {
            canvasContext.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
          }
        } else {
          qualityToggle.classList.remove('visible');
          undoBtn.classList.add('visible');
          manualInstructions.classList.add('visible');
          selectionCanvas.classList.add('visible');
        }
      });
    });

    // Quality toggle handlers (for auto mode)
    qualityOptions.forEach(option => {
      option.addEventListener('click', () => {
        qualityOptions.forEach(opt => opt.classList.remove('active'));
        option.classList.add('active');
        selectedModel = option.dataset.model;
      });
    });


    // Handle file selection (from camera or file upload)
    function handleFileSelection(e) {
      const file = e.target.files[0];
      if (!file) return;

      // File size validation (max 10MB)
      const maxSize = 10 * 1024 * 1024; // 10MB in bytes
      if (file.size > maxSize) {
        status.className = 'error visible';
        status.textContent = 'File too large. Maximum size: 10MB';
        cameraInput.value = '';
        fileUpload.value = '';
        return;
      }

      // MIME type validation
      const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/gif'];
      if (!validTypes.includes(file.type.toLowerCase())) {
        status.className = 'error visible';
        status.textContent = 'Invalid file type. Please select an image (JPEG, PNG, WebP, or GIF).';
        cameraInput.value = '';
        fileUpload.value = '';
        return;
      }

      selectedFile = file;
      processedImage = null;
      rotation = 0;
      strokes = [];
      currentStroke = [];
      isDrawing = false;

      // Show original preview
      const reader = new FileReader();
      reader.onload = (e) => {
        originalPreview.src = e.target.result;
        originalPreview.classList.add('visible');
        captureArea.classList.add('has-image');

        // Setup canvas for manual mode
        originalPreview.onload = () => {
          const rect = originalPreview.getBoundingClientRect();
          selectionCanvas.width = rect.width;
          selectionCanvas.height = rect.height;
          canvasContext = selectionCanvas.getContext('2d');
        };
      };
      reader.readAsDataURL(file);

      modeToggle.classList.add('visible');
      // Show appropriate toggles based on mode
      if (selectedMode === 'auto') {
        qualityToggle.classList.add('visible');
      } else {
        undoBtn.classList.add('visible');
        manualInstructions.classList.add('visible');
        selectionCanvas.classList.add('visible');
      }
      processBtn.classList.add('visible');
      previewArea.classList.remove('visible');
      status.classList.remove('visible');
    }

    // Attach handler to both inputs
    cameraInput.addEventListener('change', handleFileSelection);
    fileUpload.addEventListener('change', handleFileSelection);

    // --- Brush painting handlers for manual mode ---

    function getCanvasPos(e) {
      const rect = selectionCanvas.getBoundingClientRect();
      if (e.touches) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
      }
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function drawStrokeSegment(from, to) {
      canvasContext.strokeStyle = 'rgba(255, 0, 0, 0.4)';
      canvasContext.lineWidth = BRUSH_SIZE;
      canvasContext.lineCap = 'round';
      canvasContext.lineJoin = 'round';
      canvasContext.beginPath();
      canvasContext.moveTo(from.x, from.y);
      canvasContext.lineTo(to.x, to.y);
      canvasContext.stroke();
    }

    function redrawAllStrokes() {
      if (!canvasContext) return;
      canvasContext.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
      for (const stroke of strokes) {
        if (stroke.length < 2) {
          // Single dot
          canvasContext.fillStyle = 'rgba(255, 0, 0, 0.4)';
          canvasContext.beginPath();
          canvasContext.arc(stroke[0].x, stroke[0].y, BRUSH_SIZE / 2, 0, 2 * Math.PI);
          canvasContext.fill();
          continue;
        }
        canvasContext.strokeStyle = 'rgba(255, 0, 0, 0.4)';
        canvasContext.lineWidth = BRUSH_SIZE;
        canvasContext.lineCap = 'round';
        canvasContext.lineJoin = 'round';
        canvasContext.beginPath();
        canvasContext.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          canvasContext.lineTo(stroke[i].x, stroke[i].y);
        }
        canvasContext.stroke();
      }
    }

    function startDrawing(e) {
      if (selectedMode !== 'manual' || !canvasContext) return;
      e.preventDefault();
      isDrawing = true;
      const pos = getCanvasPos(e);
      currentStroke = [pos];
      // Draw initial dot
      canvasContext.fillStyle = 'rgba(255, 0, 0, 0.4)';
      canvasContext.beginPath();
      canvasContext.arc(pos.x, pos.y, BRUSH_SIZE / 2, 0, 2 * Math.PI);
      canvasContext.fill();
    }

    function continueDrawing(e) {
      if (!isDrawing || !canvasContext) return;
      e.preventDefault();
      const pos = getCanvasPos(e);
      const lastPos = currentStroke[currentStroke.length - 1];
      currentStroke.push(pos);
      drawStrokeSegment(lastPos, pos);
    }

    function stopDrawing(e) {
      if (!isDrawing) return;
      e.preventDefault();
      isDrawing = false;
      if (currentStroke.length > 0) {
        strokes.push(currentStroke);
        currentStroke = [];
      }
    }

    // Mouse events
    selectionCanvas.addEventListener('mousedown', startDrawing);
    selectionCanvas.addEventListener('mousemove', continueDrawing);
    selectionCanvas.addEventListener('mouseup', stopDrawing);
    selectionCanvas.addEventListener('mouseleave', stopDrawing);

    // Touch events
    selectionCanvas.addEventListener('touchstart', startDrawing);
    selectionCanvas.addEventListener('touchmove', continueDrawing);
    selectionCanvas.addEventListener('touchend', stopDrawing);
    selectionCanvas.addEventListener('touchcancel', stopDrawing);

    // --- Point sampling from painted canvas ---

    function samplePointsFromCanvas() {
      if (!canvasContext) return { points: [], labels: [] };

      const w = selectionCanvas.width;
      const h = selectionCanvas.height;
      const imageData = canvasContext.getImageData(0, 0, w, h);
      const data = imageData.data;

      // Calculate image display bounds (object-fit: contain)
      const imgNaturalRatio = originalPreview.naturalWidth / originalPreview.naturalHeight;
      const containerRatio = w / h;
      let displayedWidth, displayedHeight, offsetX, offsetY;
      if (imgNaturalRatio > containerRatio) {
        displayedWidth = w;
        displayedHeight = w / imgNaturalRatio;
        offsetX = 0;
        offsetY = (h - displayedHeight) / 2;
      } else {
        displayedWidth = h * imgNaturalRatio;
        displayedHeight = h;
        offsetX = (w - displayedWidth) / 2;
        offsetY = 0;
      }

      // Grid sample - ~20 cells per dimension
      const gridStep = Math.max(Math.floor(Math.min(w, h) / 20), 8);
      const paintedPoints = [];
      const unpaintedPoints = [];

      for (let gy = gridStep / 2; gy < h; gy += gridStep) {
        for (let gx = gridStep / 2; gx < w; gx += gridStep) {
          // Check if this point is within the image bounds
          if (gx < offsetX || gx > offsetX + displayedWidth ||
              gy < offsetY || gy > offsetY + displayedHeight) continue;

          const idx = (Math.floor(gy) * w + Math.floor(gx)) * 4;
          const r = data[idx];
          const a = data[idx + 3];

          // Painted = has red with some alpha
          if (r > 100 && a > 30) {
            paintedPoints.push({ cx: gx, cy: gy });
          } else {
            unpaintedPoints.push({ cx: gx, cy: gy });
          }
        }
      }

      // Cap remove points at ~30
      let removePoints = paintedPoints;
      if (removePoints.length > 30) {
        const step = Math.ceil(removePoints.length / 30);
        removePoints = removePoints.filter((_, i) => i % step === 0);
      }

      // Pick 1 foreground point from unpainted area (center-most)
      let keepPoint = null;
      if (unpaintedPoints.length > 0) {
        const centerX = offsetX + displayedWidth / 2;
        const centerY = offsetY + displayedHeight / 2;
        unpaintedPoints.sort((a, b) => {
          const da = (a.cx - centerX) ** 2 + (a.cy - centerY) ** 2;
          const db = (b.cx - centerX) ** 2 + (b.cy - centerY) ** 2;
          return da - db;
        });
        keepPoint = unpaintedPoints[0];
      }

      // Convert canvas coords to image natural coords
      const scaleX = originalPreview.naturalWidth / displayedWidth;
      const scaleY = originalPreview.naturalHeight / displayedHeight;

      const points = [];
      const labels = [];

      // Add foreground point first (label=1)
      if (keepPoint) {
        const imgX = (keepPoint.cx - offsetX) * scaleX;
        const imgY = (keepPoint.cy - offsetY) * scaleY;
        points.push([imgY, imgX]); // [y, x] format for rembg
        labels.push(1);
      }

      // Add remove points (label=0)
      for (const p of removePoints) {
        const imgX = (p.cx - offsetX) * scaleX;
        const imgY = (p.cy - offsetY) * scaleY;
        points.push([imgY, imgX]);
        labels.push(0);
      }

      return { points, labels };
    }

    // Undo button handler - remove last brush stroke
    undoBtn.addEventListener('click', () => {
      if (strokes.length === 0) return;
      strokes.pop();
      redrawAllStrokes();
      status.classList.remove('visible');
    });

    // Drag-and-drop support for desktop
    captureArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!captureArea.classList.contains('has-image')) {
        captureArea.classList.add('drag-over');
      }
    });

    captureArea.addEventListener('dragleave', (e) => {
      e.preventDefault();
      captureArea.classList.remove('drag-over');
    });

    captureArea.addEventListener('drop', (e) => {
      e.preventDefault();
      captureArea.classList.remove('drag-over');

      if (captureArea.classList.contains('has-image')) return;

      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        // Trigger the same validation and preview logic
        const fakeEvent = { target: { files: [file] } };
        handleFileSelection(fakeEvent);
      } else if (file) {
        status.className = 'error visible';
        status.textContent = 'Invalid file type. Please drop an image file.';
      }
    });

    // Process (remove background)
    processBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      // Validate manual mode has strokes
      if (selectedMode === 'manual' && strokes.length === 0) {
        status.className = 'error visible';
        status.textContent = 'Please paint over areas to remove first';
        return;
      }

      processBtn.disabled = true;
      status.className = 'processing visible';

      if (selectedMode === 'manual') {
        status.innerHTML = `<span class="spinner"></span>Processing painted area...`;
      } else {
        status.innerHTML = '<span class="spinner"></span>Removing background...';
      }

      const formData = new FormData();
      formData.append('photo', selectedFile);
      formData.append('mode', selectedMode); // Pass mode (auto or manual)

      if (selectedMode === 'auto') {
        formData.append('model', selectedModel); // Pass selected model for auto mode
      } else {
        // Sample points from painted canvas for SAM
        const sampled = samplePointsFromCanvas();
        formData.append('points', JSON.stringify(sampled.points));
        formData.append('labels', JSON.stringify(sampled.labels));
        // Send original image dimensions so server can scale correctly
        formData.append('image_width', originalPreview.naturalWidth);
        formData.append('image_height', originalPreview.naturalHeight);
      }

      try {
        const response = await fetch('/process', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (response.ok && result.success) {
          processedImage = result.image;
          rotation = 0;

          // Show sticker preview
          stickerImg.src = processedImage;
          stickerImg.style.transform = 'rotate(0deg)';

          // Hide capture, show preview
          captureArea.style.display = 'none';
          modeToggle.classList.remove('visible');
          qualityToggle.classList.remove('visible');
          undoBtn.classList.remove('visible');
          manualInstructions.classList.remove('visible');
          selectionCanvas.classList.remove('visible');
          processBtn.classList.remove('visible');
          status.classList.remove('visible');
          previewArea.classList.add('visible');
        } else {
          throw new Error(result.error || 'Processing failed');
        }
      } catch (error) {
        status.className = 'error visible';
        status.textContent = 'Error: ' + error.message;
        processBtn.disabled = false;
      }
    });

    // Rotate left
    rotateLeftBtn.addEventListener('click', () => {
      rotation = (rotation - 90) % 360;
      stickerImg.style.transform = `rotate(${rotation}deg)`;
    });

    // Rotate right
    rotateRightBtn.addEventListener('click', () => {
      rotation = (rotation + 90) % 360;
      stickerImg.style.transform = `rotate(${rotation}deg)`;
    });

    // Submit to stage
    submitBtn.addEventListener('click', async () => {
      if (!processedImage) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Adding...';

      try {
        const response = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: processedImage,
            rotation: rotation
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          status.className = 'success visible';
          status.textContent = 'Sticker added to stage!';
          previewArea.classList.remove('visible');

          // Auto reset after 2 seconds
          setTimeout(resetForm, 2000);
        } else {
          throw new Error(result.error || 'Submit failed');
        }
      } catch (error) {
        status.className = 'error visible';
        status.textContent = 'Error: ' + error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add to Stage';
      }
    });

    // Retake photo
    retakeBtn.addEventListener('click', resetForm);

    function resetForm() {
      selectedFile = null;
      processedImage = null;
      rotation = 0;
      strokes = [];
      currentStroke = [];
      isDrawing = false;
      cameraInput.value = '';
      fileUpload.value = '';
      originalPreview.src = '';
      originalPreview.classList.remove('visible');
      captureArea.classList.remove('has-image');
      captureArea.style.display = 'flex';
      modeToggle.classList.remove('visible');
      qualityToggle.classList.remove('visible');
      undoBtn.classList.remove('visible');
      manualInstructions.classList.remove('visible');
      selectionCanvas.classList.remove('visible');
      if (canvasContext) {
        canvasContext.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
      }
      processBtn.classList.remove('visible');
      processBtn.disabled = false;
      previewArea.classList.remove('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Add to Stage';
      status.classList.remove('visible');
    }
  </script>
</body>
</html>
