<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Access</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: #1a1a1a;
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      text-align: center;
      color: #fff;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #aaa;
      font-weight: 500;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      background: #2d2d2d;
      border: 2px solid #4a4a4a;
      border-radius: 8px;
      color: white;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #6c63ff;
    }

    input[type="password"]::placeholder {
      color: #666;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #5a52d5;
    }

    button:active {
      background: #4a42c5;
    }

    .error-message {
      margin-top: 16px;
      padding: 12px;
      background: #5c1e1e;
      color: #f87171;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    .hint {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Camera Access</h1>
    <p class="subtitle">Enter password to access the camera</p>

    <form method="POST">
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
          required
          autofocus
        >
      </div>

      {% if error %}
      <div class="error-message visible">{{ error }}</div>
      {% endif %}

      <button type="submit">Unlock Camera</button>
    </form>

  </div>
</body>
</html>
